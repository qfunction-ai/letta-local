# Disposable smoke-test environment for LettaLocal release candidates.
# Spin up, run scripts/smoke/smoke_test.sh, tear down. Nothing persists.
#
# Usage:
#   docker build -t letta-local:smoke .
#   SMOKE_IMAGE=letta-local:smoke scripts/smoke/smoke_test.sh

name: letta-smoke

services:
  letta:
    image: ${SMOKE_IMAGE:-letta-local:smoke}
    ports:
      - "${SMOKE_PORT:-8284}:8283"
    environment:
      # No LETTA_PG_URI / LETTA_REDIS_HOST -> the image boots its internal
      # PostgreSQL + Redis against the disposable volume below. Fully
      # self-contained, nothing touches the host.
      # Host Ollama for local models (checks 3-4; the rest need no LLM).
      # NOTE: ModelSettings has NO env prefix (env_prefix commented out in
      # settings.py) — the variable is OLLAMA_BASE_URL, not LETTA_OLLAMA_BASE_URL.
      # /v1 suffix mirrors Epsilon's compose (OpenAI-compat surface).
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - smoke-data:/root/.letta

volumes:
  smoke-data:
