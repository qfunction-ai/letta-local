# B-3 (v0.16.39): baseline-gated dependency vulnerability scanning.
# pip-audit against the uv.lock export (deterministic — not the live env).
# Advisories recorded in security/dependency-baseline.txt are accepted.
# A NEW advisory with a fix version fails the build; without a fix it warns.
# The baseline may only shrink — uncommented additions fail the growth check.
name: Dependency Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # growth check needs the base ref's baseline

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install pip-audit
        run: pipx install pip-audit

      - name: Export lockfile to requirements
        # R-2 (Part B review): --all-extras — the scan must match what the
        # container installs (Dockerfile: uv sync --frozen --no-dev --all-extras).
        # Without it CI saw 251 pins vs the container's 342.
        run: uv export --format requirements-txt --frozen --no-hashes --no-dev --all-extras -o /tmp/requirements.txt

      - name: Build pip-audit ignore flags from baseline
        run: |
          FLAGS=""
          while read -r id; do
            case "$id" in ""|\#*) continue;; esac
            FLAGS="$FLAGS --ignore-vuln $id"
          done < security/dependency-baseline.txt
          echo "IGNORE_FLAGS<<EOF" >> "$GITHUB_ENV"
          echo "$FLAGS" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Audit dependencies (full, for the record)
        # --no-deps: the export is the fully-pinned closure; audit exactly the
        # pins, no re-resolution.
        run: pip-audit -r /tmp/requirements.txt --no-deps --format json -o /tmp/audit_full.json || true

      - name: Audit dependencies (gated)
        run: |
          # pip-audit exits 1 when it finds (non-ignored) vulnerabilities but
          # still writes the JSON output; the gate script classifies whatever
          # it finds (new fixable fails, new unfixable warns).
          set +e
          pip-audit -r /tmp/requirements.txt --no-deps $IGNORE_FLAGS --format json -o /tmp/audit.json
          AUDIT_EXIT=$?
          set -e
          echo "pip-audit exit: ${AUDIT_EXIT}"

      - name: Baseline growth check + gate
        # R-3 (Part B review): after actions/checkout on a push, origin/main IS
        # the pushed commit — comparing against it compares the baseline to
        # itself and the growth check can never fail. On push, compare against
        # the event's previous SHA. Schedule/dispatch have no "before" — skip
        # the growth check there (the gate itself still runs).
        run: |
          GROWTH_ARGS=""
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$GITHUB_EVENT_BEFORE" ] && [ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git show "$GITHUB_EVENT_BEFORE:security/dependency-baseline.txt" > /tmp/baseline_head.txt
            GROWTH_ARGS="--growth-check --head-baseline /tmp/baseline_head.txt"
            echo "growth check: comparing against $GITHUB_EVENT_BEFORE"
          else
            echo "no previous commit (schedule/dispatch/new branch): growth check skipped, gate still runs"
          fi
          python3 scripts/dependency_scan_gate.py \
            --audit /tmp/audit.json \
            --baseline security/dependency-baseline.txt \
            --full-audit /tmp/audit_full.json \
            $GROWTH_ARGS

      - name: Record full audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: /tmp/audit_full.json
