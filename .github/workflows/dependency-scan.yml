# B-3 (v0.16.39): baseline-gated dependency vulnerability scanning.
# pip-audit against the uv.lock export (deterministic — not the live env).
# Advisories recorded in security/dependency-baseline.txt are accepted.
# A NEW advisory with a fix version fails the build; without a fix it warns.
# The baseline may only shrink — uncommented additions fail the growth check.
name: Dependency Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # growth check needs the base ref's baseline

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Set up Python 3.11 (container parity)
        # Release-verification fix (2026-11-24): pipx installed pip-audit under
        # the runner default Python 3.14, which has no lxml 5.4.0 wheel — pip
        # fell back to the sdist and died on missing libxml2 headers, so the
        # audit never produced output. The container runs Debian bookworm's
        # Python 3.11; the audit must run under the interpreter we ship.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Export lockfile to requirements
        # R-2 (Part B review): the scan must match what the container installs.
        # C-2 (v0.16.40): the container now installs an EXPLICIT extras list
        # (Dockerfile: postgres, sqlite, server, external-tools) — dev dropped,
        # the rest pending the consumer matrix. Keep this export in lockstep
        # with the Dockerfile's --extra list, same commit.
        run: uv export --format requirements-txt --frozen --no-hashes --no-dev --extra postgres --extra sqlite --extra server --extra external-tools -o /tmp/requirements.txt

      - name: Build pip-audit ignore flags from baseline
        run: |
          FLAGS=""
          while read -r id; do
            case "$id" in ""|\#*) continue;; esac
            FLAGS="$FLAGS --ignore-vuln $id"
          done < security/dependency-baseline.txt
          echo "IGNORE_FLAGS<<EOF" >> "$GITHUB_ENV"
          echo "$FLAGS" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Audit dependencies (full, for the record)
        # --no-deps: the export is the fully-pinned closure; audit exactly the
        # pins, no re-resolution.
        # --disable-pip (v0.16.40 B-3 hardening, approved with the .39 release
        # review): with --no-deps, pip-audit installs NOTHING — it only looks
        # up each pinned name==version in the advisory database. This removes
        # the source-build failure class entirely (the lxml cp314 sdist crash
        # behind the v0.16.39 CI fix) and the runner's Python version stops
        # mattering. Python 3.11 setup stays, for container parity.
        run: pip-audit -r /tmp/requirements.txt --no-deps --disable-pip --format json -o /tmp/audit_full.json || true

      - name: Audit dependencies (gated)
        run: |
          # pip-audit exits 1 when it finds (non-ignored) vulnerabilities but
          # still writes the JSON output; the gate script classifies whatever
          # it finds (new fixable fails, new unfixable warns).
          # --disable-pip: see the full-audit step above.
          set +e
          pip-audit -r /tmp/requirements.txt --no-deps --disable-pip $IGNORE_FLAGS --format json -o /tmp/audit.json
          AUDIT_EXIT=$?
          set -e
          echo "pip-audit exit: ${AUDIT_EXIT}"

      - name: Baseline growth check + gate
        # R-3 (Part B review): after actions/checkout on a push, origin/main IS
        # the pushed commit — comparing against it compares the baseline to
        # itself and the growth check can never fail. On push, compare against
        # the event's previous SHA. Schedule/dispatch have no "before" — skip
        # the growth check there (the gate itself still runs).
        # T-1 (re-check): the baseline file does not exist at commits before
        # its creation (e.g. 7b88fa26, the pre-baseline main that the .39
        # fast-forward pushes from) — `git show` exits 128 and kills the step
        # under bash -e. Guard with cat-file -e and skip the growth check on
        # the creation commit.
        run: |
          GROWTH_ARGS=""
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$GITHUB_EVENT_BEFORE" ] && [ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "$GITHUB_EVENT_BEFORE:security/dependency-baseline.txt" 2>/dev/null; then
              git show "$GITHUB_EVENT_BEFORE:security/dependency-baseline.txt" > /tmp/baseline_head.txt
              GROWTH_ARGS="--growth-check --head-baseline /tmp/baseline_head.txt"
              echo "growth check: comparing against $GITHUB_EVENT_BEFORE"
            else
              echo "baseline did not exist at $GITHUB_EVENT_BEFORE (creation push): growth check skipped, gate still runs"
            fi
          else
            echo "no previous commit (schedule/dispatch/new branch): growth check skipped, gate still runs"
          fi
          if [ ! -f /tmp/audit.json ]; then
            echo "::error::gated audit did not produce output — see the 'Audit dependencies (gated)' step above"
            exit 1
          fi
          python3 scripts/dependency_scan_gate.py \
            --audit /tmp/audit.json \
            --baseline security/dependency-baseline.txt \
            --full-audit /tmp/audit_full.json \
            $GROWTH_ARGS

      - name: Record full audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: /tmp/audit_full.json
