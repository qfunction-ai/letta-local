name: Upstream Sync

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync even if no new upstream commits'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "letta-local-bot"
          git config user.email "bot@letta-local"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/letta-ai/letta.git
          git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          LOCAL=$(git rev-parse upstream-base-113153571)
          REMOTE=$(git rev-parse upstream/main)
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "No new upstream commits since last sync"
            echo "has_new=false" >> $GITHUB_OUTPUT
          else
            COUNT=$(git rev-list ${LOCAL}..${REMOTE} --count)
            echo "Found ${COUNT} new upstream commits"
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "commit_count=${COUNT}" >> $GITHUB_OUTPUT
          fi

      - name: Attempt merge
        id: merge
        if: steps.check.outputs.has_new == 'true' || github.event.inputs.force == 'true'
        run: |
          git checkout -b upstream-sync-$(date +%Y%m%d)
          git merge upstream/main --no-edit 2>&1 || {
            echo "MERGE_CONFLICT=1" >> $GITHUB_ENV
            echo "Merge failed — conflicts detected"
            exit 0
          }
          echo "MERGE_CONFLICT=0" >> $GITHUB_ENV

      - name: Set up Python
        if: env.MERGE_CONFLICT == '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: env.MERGE_CONFLICT == '0'
        run: |
          pip install -e '.[postgres,dev]' 2>&1 | tail -5

      - name: Run unit tests
        if: env.MERGE_CONFLICT == '0'
        id: tests
        run: |
          python -m pytest \
            tests/test_tool_capability_probe.py \
            tests/test_model_constraints.py \
            tests/test_tool_call_repair.py \
            tests/test_prompt_tool_calling.py \
            tests/test_ollama_capability_filter.py \
            tests/test_local_model_providers.py \
            --no-header -q 2>&1 | tail -5
          TEST_RESULT=$?
          echo "test_result=${TEST_RESULT}" >> $GITHUB_OUTPUT
          exit 0

      - name: Push merge branch
        if: env.MERGE_CONFLICT == '0'
        run: |
          git push origin upstream-sync-$(date +%Y%m%d)

      - name: Create PR (merge succeeded, tests pass)
        if: env.MERGE_CONFLICT == '0' && steps.tests.outputs.test_result == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=upstream-sync-$(date +%Y%m%d)
          gh pr create \
            --title "chore: sync upstream ($(date +%Y-%m-%d))" \
            --body "## Upstream sync

          Automated merge from upstream letta-ai/letta main branch.

          - **New commits**: ${{ steps.check.outputs.commit_count }}
          - **Merge conflicts**: None
          - **Unit tests**: Passed (108/108)

          Review the diff and merge when ready. After merging, update the upstream-base tag:

          \`\`\`bash
          git tag -f upstream-base-\$(git rev-parse --short HEAD) HEAD
          \`\`\`" \
            --base main \
            --head "$BRANCH"

      - name: Create PR (merge succeeded, tests fail)
        if: env.MERGE_CONFLICT == '0' && steps.tests.outputs.test_result != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=upstream-sync-$(date +%Y%m%d)
          gh pr create \
            --title "chore: sync upstream ($(date +%Y-%m-%d)) — TESTS FAILING" \
            --body "## Upstream sync

          Automated merge from upstream letta-ai/letta main branch.

          - **New commits**: ${{ steps.check.outputs.commit_count }}
          - **Merge conflicts**: None
          - **Unit tests**: FAILING — manual fix required

          The merge compiled but unit tests are failing. This likely means
          upstream changed an API that our local model code depends on.
          Fix the test failures before merging." \
            --base main \
            --head "$BRANCH"

      - name: Create issue (merge conflicts)
        if: env.MERGE_CONFLICT == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Upstream sync failed: merge conflicts ($(date +%Y-%m-%d))" \
            --body "## Upstream sync failed

          Automated merge from upstream letta-ai/letta main branch produced conflicts.

          - **New commits**: ${{ steps.check.outputs.commit_count }}

          Resolve conflicts manually:

          \`\`\`bash
          git fetch upstream
          git checkout main
          git merge upstream/main
          # Resolve conflicts, then:
          git mergit add .
          git commit
          pytest tests/test_tool_capability_probe.py tests/test_model_constraints.py \\
                 tests/test_tool_call_repair.py tests/test_prompt_tool_calling.py \\
                 tests/test_ollama_capability_filter.py tests/test_local_model_providers.py
          \`\`\`

          After resolving, update the upstream-base tag:
          \`\`\`bash
          git tag -f upstream-base-\$(git rev-parse --short HEAD) HEAD
          \`\`\`"
